schema {
  query: Query
  mutation: Mutation
}

type AuthenticatedViewer implements Node {
  asUser: User!
  displayName: String
  email: String
  id: ID!
  unreadMessageCount: Int!
  unreadMessages(after: String, before: String, first: Int, last: Int): AuthenticatedViewerUnreadMessagesConnection
  username: String
}

type AuthenticatedViewerUnreadMessagesConnection {
  edges: [AuthenticatedViewerUnreadMessagesConnectionEdge]
  pageInfo: PageInfo!
}

type AuthenticatedViewerUnreadMessagesConnectionEdge {
  cursor: String!
  node: Message
}

type CreateUserResult {
  message: String
  success: Boolean
  user: User
}

"""Extended user info for the logged-in user"""
type CurrentUser implements Node {
  asUser: User!
  displayName: String
  email: String
  id: ID!
  profile: Profile
  unreadMessageCount: Int!
  username: String
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Follow implements Node {
  createdAt: DateTime
  """The user being followed"""
  followedBy: User
  """ID of the user being followed"""
  followedById: ID
  """The user who is following"""
  following: User
  followingDuration: String
  """ID of the user who is following"""
  followingId: ID
  id: ID!
  isMutual: Boolean
}

type FollowResult {
  follow: Follow
  message: String
  success: Boolean
}

type Message implements Node {
  content: String
  createdAt: DateTime
  id: ID!
  isRead: Boolean
  readAt: DateTime
  receiver: User!
  recentReply(after: DateTime!): String
  replies: [Message!]
  repliesConnectionSimple(after: String, before: String, first: Int, last: Int, oldestFirst: Boolean = true): MessageRepliesConnectionSimpleConnection
  replyTo: Message
  sender: User!
  senderDisplayName: String
  senderInfo(includeEmail: Boolean = false): String
}

type MessageAuthor implements Node {
  avatarUrl: String
  displayName: String
  fullProfile: PublicProfile!
  id: ID!
  recentActivityCount: Int!
  totalMessagesSent: Int!
  username: String
}

type MessageConnection {
  edges: [MessageEdgeNew]
  """Whether any message in this connection has replies"""
  hasReplies: Boolean
  latestMessageData: DateTime
  pageInfo: PageInfo!
  """Total number of messages"""
  totalCount: Int
  unreadCount: Int
}

type MessageEdgeNew {
  cursor: String!
  """Whether any message in this connection has replies"""
  hasReplies: Boolean
  node: Message
}

"""Message preview in lists"""
type MessagePreview implements Node {
  createdAt: DateTime
  fullMessage: Message!
  hasReplies: Boolean
  id: ID!
  isRead: Boolean
  preview: String
  replyCount: Int!
  sender: UserCard
}

type MessageRepliesConnectionSimpleConnection {
  edges: [MessageRepliesConnectionSimpleConnectionEdge]
  pageInfo: PageInfo!
}

type MessageRepliesConnectionSimpleConnectionEdge {
  cursor: String!
  node: Message
}

type MessageWithAuthor implements Node {
  author: MessageAuthor
  content: String
  createdAt: DateTime
  fullMessage: Message!
  id: ID!
}

type Mutation {
  createUser(displayName: String, email: String!, username: String): CreateUserResult
  followUser(
    """Current User"""
    currentUserId: ID!
    """User to follow"""
    userIdToFollow: ID!
  ): FollowResult
  sendMessage(content: String!, receiverId: ID!, replyToId: ID, senderId: ID!): SendMessageResult
  unfollowUser(
    """Current User"""
    currentUserId: ID!
    """User to follow"""
    userIdToUnfollow: ID!
  ): FollowResult
}

interface Node {
  id: ID!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Profile implements Node {
  avatar: String
  createdAt: DateTime
  id: ID!
  updatedAt: DateTime
}

type PublicProfile implements Node {
  displayName: String
  followerCount: Int!
  followingCount: Int!
  fullUser: User!
  id: ID!
  profile: Profile
  username: String
}

type Query {
  message(id: String!): Message
  messages: [Message!]
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
  publicProfile(userId: ID!): PublicProfile
  recentMessagesWithAuthors: [MessageWithAuthor!]
  user(id: ID!): User
  userFollowings(after: String, before: String, first: Int, last: Int, userId: ID!): QueryUserFollowingsConnection
  users: [User!]
  viewer(id: ID!): AuthenticatedViewer
}

type QueryUserFollowingsConnection {
  edges: [QueryUserFollowingsConnectionEdge]
  pageInfo: PageInfo!
}

type QueryUserFollowingsConnectionEdge {
  cursor: String!
  node: User
}

type SendMessageResult {
  error: String
  message: Message
  success: Boolean
}

type User implements Node {
  advancedMessages(after: DateTime, before: DateTime, hasReplies: Boolean, read: Boolean, skip: Int = 0, sortBy: String = "createdAt", sortOrder: String = "desc", take: Int = 20): [Message!]
  advancedMessagesConnection(after: String, before: String, first: Int, hasReplies: Boolean, last: Int, oldestFirst: Boolean = false, search: String, unreadOnly: Boolean = false): UserAdvancedMessagesConnection
  asViewer: AuthenticatedViewer!
  avatarUrl: String
  createdAt: DateTime
  displayName: String
  email: String!
  """Total number of followers"""
  followerCount: Int!
  """Users who follow this user"""
  followers: [User!]
  followersConnection(after: String, before: String, first: Int, last: Int): UserFollowersConnection
  """Users this user follows"""
  following: [User!]
  followingConnection(after: String, before: String, first: Int, last: Int, sortByRecent: Boolean = true, verified: Boolean): UserFollowingConnection
  """Total number of users being followed"""
  followingCount: Int!
  hasAvatar: Boolean
  id: ID!
  isFollowed(userId: ID!): Boolean
  isFollowing(userId: ID!): Boolean
  lastMessagePreview: String
  messages(limit: Int = 10, oldestFirst: Boolean = false, search: String, unreadOnly: Boolean = false): [Message!]
  messagesConnection(after: String, before: String, first: Int, last: Int, search: String, unreadOnly: Boolean = false): MessageConnection
  mutualFollowers: [User!]
  name: String
  profile: Profile
  publicProfile: PublicProfile!
  receivedMessageConnection(after: String, before: String, first: Int, last: Int, unreadOnly: Boolean = false): MessageConnection
  receivedMessages: [Message!]
  receivedMessagesConnection(after: String, before: String, first: Int, hasReplies: Boolean, last: Int, oldestFirst: Boolean = false, search: String, unreadOnly: Boolean = false): UserReceivedMessagesConnection
  recentMessages: [Message!]
  repliedMessageCount: Int!
  sentMessages: [Message!]
  sentMessagesConnection(after: String, before: String, first: Int, last: Int, search: String, unreadOnly: Boolean = false): MessageConnection
  todayMessageCount: Int!
  totalMessageCount: Int!
  unreadCount: Int
  unreadMessageCount: Int!
  username: String
}

type UserAdvancedMessagesConnection {
  edges: [UserAdvancedMessagesConnectionEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserAdvancedMessagesConnectionEdge {
  cursor: String!
  node: Message
}

"""Minimal user info for cards/lists"""
type UserCard implements Node {
  avatarUrl: String
  displayName: String
  followerCount: Int!
  followingCount: Int!
  fullProfile: User!
  id: ID!
  username: String
}

type UserFollowersConnection {
  edges: [UserFollowersConnectionEdge]
  pageInfo: PageInfo!
  totalCount: Int
}

type UserFollowersConnectionEdge {
  cursor: String!
  followSince: DateTime
  isMutual: Boolean
  node: User
}

type UserFollowingConnection {
  edges: [UserFollowingConnectionEdge]
  pageInfo: PageInfo!
}

type UserFollowingConnectionEdge {
  cursor: String!
  followedSince: DateTime
  node: User
}

type UserReceivedMessagesConnection {
  edges: [UserReceivedMessagesConnectionEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserReceivedMessagesConnectionEdge {
  cursor: String!
  node: Message
}