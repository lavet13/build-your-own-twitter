services:
  postgres:
     # inherits everything from base, no port exposure in prod
    ports: [] # override — don't expose postgres port in production

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./packages/server/.env.production # uses postgres:5432
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy # wait for DB to be ready before starting
    networks:
      - app_network
    # NOT exposed to host — only nginx can reach it internally

  nginx:
    image: jonasal/nginx-certbot:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./nginx/conf.d/.env
    volumes:
      - nginx_secrets:/etc/letsencrypt # stores certificates, persists across restarts
      - ./nginx/conf.d:/etc/nginx/user_conf.d # your nginx config files
      - ./packages/client/dist:/var/www/html # built Vite output
    depends_on:
      - server
    networks:
      - app_network

volumes:
  nginx_secrets: # certificates survive container restarts
