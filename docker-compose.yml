services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5" # Max 50% of one CPU
          memory: 512M # Max 512MB RAM
    environment:
      TZ: "Europe/Moscow"
      PGTZ: "Europe/Moscow"
    env_file:
      - ./packages/server/.env
    ports:
      # Bind only to localhost — not exposed to the internet
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
