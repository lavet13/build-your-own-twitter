server {
    listen 80;
    server_name donbass-tour.duckdns.org;
    # nginx-certbot handles the ACME challenge automatically
    # and redirects HTTP to HTTPS once cert is issued
}

server {
    listen 443 ssl;
    server_name donbass-tour.duckdns.org;

    # These paths are managed by nginx-certbot — don't change them
    ssl_certificate     /etc/letsencrypt/live/donbass-tour.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donbass-tour.duckdns.org/privkey.pem;

    # Serve the built Vite SPA
    root /var/www/html;
    index index.html;

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy GraphQL to the Node server
    # "server" here is the Docker service name — Docker's internal DNS resolves it
    location /graphql {
        proxy_pass http://server:4000/graphql;
        proxy_http_version 1.1;

        # Required for WebSocket subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
